  }

  if (farm.exportCables) {
    const layer = L.geoJSON(farm.exportCables, {
      style: { color: '#a4413f', weight: 1.8, opacity: 0.85 },
      onEachFeature: (feature, lyr) => {
        const p = feature.properties || {};
        const shared = p.shared_with_farms ? ` (shared with ${p.shared_with_farms.join(', ')})` : '';
        lyr.bindPopup(`<b>${farm.name} - export cable</b>Manufacturer: ${p.manufacturer || '-'}<br>Length: ${p.length_m ?? '-'} m${shared}`);
      }
    }).addTo(map);
    groups.exportCables.push(layer);
    layerRefs.exportCables = layer;
  }

  const row = document.createElement('div');
  row.className = 'toggle-row';
  const counts = [
    farm.turbines ? farm.turbines.features.length + ' WTG' : null,
    farm.substations ? farm.substations.features.length + ' sub' : null,
  ].filter(Boolean).join(' / ');
  row.innerHTML = `<input type="checkbox" checked data-farm="${farm.name}"><span class="swatch" style="background:${farm.color}"></span><span class="farm-label">${farm.name}</span><span class="counts">${counts}</span>`;
  farmListEl.appendChild(row);
  row.querySelector('input').addEventListener('change', (e) => {
    const show = e.target.checked;
    Object.values(layerRefs).forEach(lyr => {
      if (show) { map.addLayer(lyr); } else { map.removeLayer(lyr); }
    });
  });
});

// Initial view was already set from a server-computed bbox (see DATA_BOUNDS/
// setView above), so the map is in the right place even if nothing below ever
// fires. This ResizeObserver is what actually gets the fit pixel-perfect: it
// reacts whenever the #map container's real size becomes available/changes,
// rather than guessing a fixed delay (a fixed setTimeout was tried first and
// intermittently fired while the flex layout had not finished settling,
// producing a container size Leaflet reads as ~0px and clamping zoom to the
// tile layer's maxZoom - this reacts to the actual size instead of a clock).
let didInitialFit = false;
const resizeObserver = new ResizeObserver(() => {
  map.invalidateSize();
  if (!didInitialFit) {
    map.fitBounds(DATA_BOUNDS, { padding: [20, 20], animate: false });
    didInitialFit = true;
  }
});
resizeObserver.observe(document.getElementById('map'));

function wireGlobalToggle(id, groupKey) {
  document.getElementById(id).addEventListener('change', (e) => {
    const show = e.target.checked;
    groups[groupKey].forEach(lyr => {
      if (show) { map.addLayer(lyr); } else { map.removeLayer(lyr); }
    });
  });
}
wireGlobalToggle('toggle-polygons', 'polygons');
wireGlobalToggle('toggle-turbines', 'turbines');
wireGlobalToggle('toggle-substations', 'substations');
wireGlobalToggle('toggle-interarray', 'interarray');
wireGlobalToggle('toggle-export', 'exportCables');
</script>
</body>
</html>
